<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap cal-top">
  <span class="brand">Duty Calendar</span>
  <a class="btn small" href="./">Sign in to add leave</a>
</div></header>
<main class="wrap" id="view"><p class="loading">Loading the calendar…</p></main>
<script>
// If the app script fails to load (for example a half-updated cache), say so instead of loading forever.
setTimeout(function () {
  var el = document.querySelector(".loading");
  if (el) el.innerHTML = "This is taking too long. <button class=\"btn small\" onclick=\"location.reload()\">Reload the page</button> If it keeps happening, press Ctrl+F5.";
}, 12000);
</script>
<script type="module" src="src/calendar.js"></script>
</body>
</html>
